name: Build i publikacja obrazu (ghcr.io)

# Buduje obraz IF-startpage z Dockerfile i wypycha go do GitHub Container
# Registry (ghcr.io/if-faber/if-startpage) przy kazdym tagu wersji (vX.Y.Z).
# Autoryzacja przez wbudowany GITHUB_TOKEN - nie wymaga zadnych sekretow
# recznie dodawanych w ustawieniach repo.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ustal tag wersji
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=manual-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Zaloguj do ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ustaw Buildx
        uses: docker/setup-buildx-action@v3

      - name: Zbuduj i wypchnij obraz
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/if-faber/if-startpage:${{ steps.version.outputs.tag }}
            ghcr.io/if-faber/if-startpage:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
