<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Homelab - Zaplecze Administracyjne</title>
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <link rel="shortcut icon" href="/images/favicon.png">
    <link rel="stylesheet" href="../../styles.css?v=0.4.2">
    <link rel="stylesheet" href="./admin.css?v=0.4.2">
    <link rel="stylesheet" href="../top/top.css?v=0.4.2d">
    <!-- Modułowa architektura Zaplecza MyHome (mods/admin) -->
    <script src="../../shared.js?v=0.4.2" defer></script>
    <script src="../top/top.js?v=0.4.2d" defer></script>
    <script src="./secure.js?v=0.4.2" defer></script>
    <script src="./tab-helper.js?v=0.4.2b" defer></script>
    <script src="./tab-alerts.js?v=0.4.2b" defer></script>
    <script src="./tab-live.js?v=0.4.2" defer></script>
    <script src="./tab-homepage.js?v=0.4.2" defer></script>
    <script src="./tab-modules.js?v=0.4.2" defer></script>
    <script src="./tab-kiosk.js?v=0.4.2" defer></script>
    <script src="./tab-updates.js?v=0.4.2c" defer></script>
    <script src="./tab-admin-theme.js?v=0.4.2" defer></script>
    <script src="./admin.js?v=0.4.2d" defer></script>
  </head>
  <body class="theme-nas">
    <div id="adminApp">
      <!-- PIN Screen -->
      <div id="pinScreen" class="admin-lock-screen">
        <form id="adminPinForm" class="modal-panel" autocomplete="off">
          <header class="modal-heading">
            <div>
              <span class="eyebrow">Autoryzacja</span>
              <h2>Dostęp administracyjny</h2>
            </div>
          </header>
          <label>
            Kod PIN
            <input id="adminPinInput" type="password" inputmode="numeric" autocomplete="new-password" placeholder="Wpisz PIN" required autofocus>
          </label>
          <menu>
            <a href="../../" class="button">Wróć do serwisu</a>
            <button class="button primary" type="submit">Odblokuj</button>
          </menu>
        </form>
      </div>

      <!-- Main Admin Dashboard Panel -->
      <div id="adminDashboard" class="admin-layout" style="display: none;">
        <!-- Left Sidebar Navigation -->
        <aside class="admin-sidebar">
          <div class="brand">
            <div>
              <strong style="font-size: 16px; letter-spacing: -0.02em;">Zaplecze MyHome</strong>
              <p style="font-size: 12px; color: var(--muted); margin-top: 2px;">Ustawienia &amp; Wygląd</p>
            </div>
          </div>

          <nav class="admin-nav" style="margin-top: 20px;">
            <button class="nav-button active" id="tab-helper" type="button">⚙️ Helper &amp; System</button>
            <button class="nav-button" id="tab-alerts" type="button">🔔 Centrum Alertów</button>
            <button class="nav-button" id="tab-live" type="button">📊 Statystyki Live</button>
            <button class="nav-button" id="tab-homepage" type="button">🏠 Homepage</button>
            <button class="nav-button" id="tab-modules" type="button">🧩 Moduły</button>
            <!-- tab-kiosk: od v0.4.2 dostępny przez hub "Moduły" (tab-modules.js), bez własnego przycisku w sidebarze -->
            <button class="nav-button" id="tab-updates" type="button">📦 Aktualizacje</button>
            <button class="nav-button" id="tab-admin-theme" type="button">⚙️ Wygląd Zaplecza</button>
          </nav>

          <div class="sidebar-actions" style="display: flex; flex-direction: column; gap: 8px; margin-top: auto;">
            <a href="../../" class="nav-button" style="text-align: center; justify-content: center; font-weight: bold;">← Powrót do serwisu</a>
            <button type="button" class="nav-button danger" onclick="logoutAdmin()" style="text-align: center; justify-content: center; font-weight: bold;">🔒 Wyloguj z Zaplecza</button>
          </div>
        </aside>

        <!-- Main Content Area -->
        <main class="admin-main">
          <header class="toolbar" style="margin-bottom: 20px;">
            <div class="page-title">
              <h1 id="tabTitle" style="font-size: 24px; margin: 0;">⚙️ Helper &amp; Ustawienia Ogólne</h1>
            </div>
          </header>
          <section id="tabContent" class="admin-content"></section>
        </main>
      </div>
    </div>

    <!-- Globalne Modale Stacked dla Zaplecza -->
    <dialog id="linkDialogAdmin" class="wide-dialog">
      <form id="linkFormAdmin" class="modal-panel">
        <header class="modal-heading">
          <div><span class="eyebrow">Zarządzanie</span><h2 id="linkDialogAdminTitle">Nowy link</h2></div>
          <button type="button" data-close aria-label="Zamknij">×</button>
        </header>
        <div class="settings-grid">
          <label>Sekcja<select id="linkSectionAdmin"></select></label>
          <label>Nazwa<input id="linkNameAdmin" required></label>
          <label style="grid-column: 1 / -1;">URL<input id="linkUrlAdmin" type="url" required placeholder="https://..."></label>
          <label style="grid-column: 1 / -1;">Opis<input id="linkDescriptionAdmin"></label>
          <label>Ikona<input id="linkIconAdmin" placeholder="Litera lub URL obrazu"></label>
          <label>Otwieranie<select id="linkOpenModeAdmin"><option value="new-tab">Nowa karta</option><option value="iframe">W dashboardzie</option></select></label>
        </div>
        <menu><button type="button" data-close class="button">Anuluj</button><button class="button primary" type="submit">Zapisz link</button></menu>
      </form>
    </dialog>

    <dialog id="logsDialog" class="wide-dialog">
      <div class="modal-panel">
        <header class="modal-heading">
          <div><span class="eyebrow">DIAGNOSTYKA DOCKER</span><h2 id="logsDialogHeaderTitle">Logi operacji</h2></div>
          <button type="button" data-close aria-label="Zamknij">×</button>
        </header>
        <pre id="logsDialogContent" class="logs-body-pre"></pre>
        <menu><button type="button" data-close class="button">Zamknij</button></menu>
      </div>
    </dialog>
  </body>
</html>
